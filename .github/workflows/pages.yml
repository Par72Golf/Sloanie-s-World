name: Build and publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # park 1's layout, then park 2's
      - run: npx jiti tools/check-layout.ts
      - run: LEVEL=1 npx jiti tools/check-layout.ts
      # the things a park can quietly break: a collectible that cannot be
      # reached, a jump that cannot be made, a ring inside a hedge
      - run: npx jiti tools/collectibles.ts
      - run: npx jiti tools/lava.ts
      - run: LEVEL=1 npx jiti tools/lava.ts
      - run: npx jiti tools/gauntlet.ts
      - run: npx jiti tools/creatures.ts
      - run: npx jiti tools/toss.ts
      - run: npx jiti tools/buttons.ts
      - run: npx jiti tools/mountain.ts
      - run: LEVEL=1 npx jiti tools/solid.ts
      - run: npx jiti tools/model-boxes.ts
      - run: npx jiti tools/placement.ts
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
